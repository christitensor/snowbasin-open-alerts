name: Snowbasin Watch

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub minimum is every 5 minutes
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test Telegram message instead of checking the mountain report"
        type: boolean
        default: false

concurrency:
  group: snowbasin-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: snowbasin_state.json
          FORCE_TEST_NOTIFY: ${{ inputs.test_notify }}
        run: python snowbasin_watch.py

      - name: Commit updated state (only if changed)
        run: |
          git config user.name "snowbasin-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add snowbasin_state.json bot_config.json
            git commit -m "Update Snowbasin state"
            git push
          fi
