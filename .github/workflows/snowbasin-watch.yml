name: Snowbasin Watch

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub minimum is every 5 minutes
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test Telegram message instead of checking the mountain report"
        type: boolean
        default: false

concurrency:
  group: snowbasin-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: snowbasin_state.json
          FORCE_TEST_NOTIFY: ${{ inputs.test_notify }}
        run: python snowbasin_watch.py

      - name: Commit updated state (only if changed)
        run: |
          git config user.name "snowbasin-watch-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet; then
            exit 0
          fi

          git add snowbasin_state.json bot_config.json
          git commit -m "Update Snowbasin state"

          # With the external pinger firing every minute, two runs can occasionally
          # overlap and both try to push a state update, so the second push gets
          # rejected as non-fast-forward. Our working tree already holds this run's
          # final (freshly re-fetched) state, so on a rejection we just re-parent
          # that same commit onto whatever is now on origin/main and try again,
          # rather than attempting a real content merge.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), retrying..."
            git fetch origin main
            git reset --mixed origin/main
            git add snowbasin_state.json bot_config.json
            git commit -m "Update Snowbasin state"
          done

          echo "::error::Failed to push updated state after 5 attempts"
          exit 1
